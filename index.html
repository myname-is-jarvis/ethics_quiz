<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>행사 퀴즈</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
:root{
  --bg:#F5F7FA; --card:#FFFFFF; --ink:#1B2430; --muted:#6B7684;
  --line:#D8DEE6; --accent:#0E7C7B; --accent-soft:#E3F2F1;
  --right:#1E8E5A; --wrong:#C8402F;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
.screen{display:none;flex:1;flex-direction:column}
.screen.active{display:flex}
h1{font-size:28px;line-height:1.25;font-weight:700;margin:24px 0 8px;letter-spacing:-.02em}
p{margin:0 0 12px;line-height:1.6}
.muted{color:var(--muted);font-size:14px}
[hidden]{display:none !important}

/* 참가 정보 */
label.field{display:block;margin:16px 0 0;font-size:14px;color:var(--muted)}
label.field .hint{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=tel]{width:100%;margin-top:6px;padding:14px;font:inherit;font-size:17px;
  border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.consent{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:14px}
.consent label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.consent input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.consent details{margin-top:10px;color:var(--muted)}
.consent summary{cursor:pointer}
.consent ul{margin:8px 0 0;padding-left:18px;line-height:1.6}
.btn{width:100%;padding:16px;margin-top:20px;border:0;border-radius:12px;background:var(--accent);color:#fff;
  font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.error{color:var(--wrong);font-size:14px;margin-top:10px;min-height:1.2em}

/* 퀴즈 */
.rail{display:flex;gap:4px;margin-top:4px}
.rail i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.rail i.done{background:var(--accent)}
.rail i.cur{background:var(--accent);opacity:.4}
.qnum{margin:28px 0 6px;font-size:14px;color:var(--muted)}
.qnum b{font-size:40px;font-weight:300;color:var(--ink);letter-spacing:-.03em;line-height:1;margin-right:6px}
.qtext{font-size:22px;line-height:1.4;font-weight:600;margin:0 0 22px;letter-spacing:-.01em;word-break:keep-all}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{flex-direction:row}
.opts.two .opt{flex:1;justify-content:center;padding:26px 12px;font-size:24px;font-weight:600}
.opts.two .opt::before{display:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 16px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  font:inherit;font-size:17px;line-height:1.4;cursor:pointer;word-break:keep-all}
.opt::before{content:"";flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt[aria-checked=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked=true]::before{border:6px solid var(--accent)}
.hint-btn{margin-top:14px;padding:12px;font-size:15px;font-weight:500}
.hint{margin-top:10px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--card);font-size:15px;line-height:1.5;word-break:keep-all}
.hint::before{content:"힌트";display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.nav{display:flex;gap:10px;margin-top:auto;padding-top:24px}
.nav .btn{margin-top:0}
.nav .ghost{flex:0 0 96px}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s,border-color .12s}}

/* 결과 */
.score{margin:32px 0 8px;font-size:14px;color:var(--muted)}
.score b{display:block;font-size:64px;font-weight:300;letter-spacing:-.04em;color:var(--ink);line-height:1;margin-top:4px}
.score b small{font-size:24px;color:var(--muted);font-weight:400;margin-left:4px}
.who{font-size:14px;color:var(--muted);margin:0 0 4px}
.prize{margin:16px 0 4px;padding:16px;border:1.5px solid var(--accent);border-radius:14px;background:var(--accent-soft)}
.prize-head{font-size:18px;font-weight:700;color:var(--accent)}
.prize-body{margin-top:6px;font-size:15px;line-height:1.5;word-break:keep-all}
.prize .btn{margin-top:14px}
.claimed{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;line-height:1.5}
.claimed small{display:block;font-weight:400;opacity:.8;font-size:13px;margin-top:2px}
.savebar{margin:12px 0 4px;padding:12px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.5;color:var(--muted)}
.savebar.warn{border-color:var(--wrong);color:var(--wrong)}
.savebar .btn.small{margin-top:10px;padding:12px;font-size:15px}
.review{list-style:none;padding:0;margin:20px 0 0;border-top:1px solid var(--line)}
.review li{padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.5;word-break:keep-all}
.review .mark{font-weight:700;margin-right:6px}
.review .ok .mark{color:var(--right)}
.review .no .mark{color:var(--wrong)}
.review .ans{color:var(--muted);font-size:14px;margin-top:4px}
</style>
</head>
<body>
<div class="app">

  <section id="s-intro" class="screen active" aria-label="참가 정보 입력">
    <h1 id="title">행사 퀴즈</h1>
    <p class="muted" id="intro-note"></p>

    <label class="field">이름
      <input id="name" type="text" autocomplete="name" maxlength="30" placeholder="홍길동">
    </label>
    <label class="field">개인번호
      <input id="emp" type="text" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="0000">
      <span class="hint">직원이 아닌 경우 0000을 입력해 주세요.</span>
    </label>
    <label class="field">휴대전화
      <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="13" placeholder="010-1234-5678">
    </label>

    <div class="consent">
      <label><input id="agree" type="checkbox"><span>개인정보 수집·이용에 동의합니다.</span></label>
      <details>
        <summary>수집 내용 보기</summary>
        <ul>
          <li>수집 항목: 이름, 개인번호, 휴대전화번호</li>
          <li>수집 목적: 퀴즈 참여 확인 및 상품 지급</li>
          <li>보유 기간: 행사 종료 후 1년 이내 파기</li>
          <li>동의를 거부할 수 있으며, 거부 시 퀴즈에 참여할 수 없습니다.</li>
        </ul>
      </details>
    </div>

    <div id="intro-error" class="error" role="alert"></div>
    <button id="btn-start" class="btn" type="button">퀴즈 시작</button>
    <button id="btn-status" class="btn ghost" type="button" hidden>내 결과 보기</button>
  </section>

  <section id="s-quiz" class="screen" aria-label="퀴즈">
    <div class="rail" id="rail" aria-hidden="true"></div>
    <div class="qnum"><b id="qnum">1</b>/ <span id="qtotal">2</span></div>
    <h2 class="qtext" id="qtext"></h2>
    <div class="opts" id="opts" role="radiogroup" aria-label="보기"></div>
    <button id="btn-hint" class="btn ghost hint-btn" type="button" hidden aria-controls="hint">힌트 보기</button>
    <div id="hint" class="hint" hidden></div>
    <div id="quiz-error" class="error" role="alert"></div>
    <button id="btn-quiz-status" class="btn ghost" type="button" hidden>내 결과 보기</button>
    <div class="nav">
      <button id="btn-prev" class="btn ghost" type="button">이전</button>
      <button id="btn-next" class="btn" type="button" disabled>다음</button>
    </div>
  </section>

  <section id="s-result" class="screen" aria-label="결과">
    <h1 id="result-title">참여 완료</h1>
    <p class="who" id="who"></p>
    <div class="score">맞힌 문제<b><span id="score">0</span><small>/ <span id="total">2</span></small></b></div>

    <div id="prize" class="prize" hidden>
      <div class="prize-head">축하합니다!</div>
      <div class="prize-body" id="prize-text"></div>
      <button id="btn-claim" class="btn" type="button">운영자 확인</button>
      <div id="claimed-box" class="claimed" hidden></div>
      <div id="claim-error" class="error" role="alert"></div>
    </div>

    <div id="save-bar" class="savebar" hidden>
      <span id="save-text"></span>
      <button id="btn-resave" class="btn ghost small" type="button" hidden>다시 저장</button>
      <button id="btn-result-status" class="btn ghost small" type="button" hidden>내 결과 보기</button>
    </div>
    <p class="muted" id="result-note"></p>
    <ul class="review" id="review"></ul>
  </section>

</div>

<script>
/* ===== 설정: 배포한 Apps Script 웹앱 URL로 교체 ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycby0BwybRketrHQVwWpEeQdk1uXDy11E6H1pZaNdIT1uwEdntcxnAZliq4MjhFg9tEA5/exec';
const EVENT_TITLE = '행사 퀴즈';
const QUESTIONS_PER_QUIZ = 2; // Code.gs의 CONFIG.QUESTIONS_PER_QUIZ와 같아야 함 (안내 문구 표시용)
const PRIZE_MIN_SCORE = 2;    // Code.gs의 CONFIG.PRIZE_MIN_SCORE와 같아야 함
const PRIZE_TEXT = '상품 부스에서 운영자에게 이 화면을 보여 주세요. 운영자가 아래 버튼을 눌러 지급을 확인합니다.';
const NO_PRIZE_TEXT = `${QUESTIONS_PER_QUIZ}문제를 모두 맞히면 상품이 지급됩니다. 참여해 주셔서 감사합니다.`;
// 혼잡(busy)·일시 오류 시 재시도: 대기 1.5s, 3s, 6s, 12s, 24s (각각 ±50% 지터)
const RETRY = { attempts: 5, baseMs: 1500 };
/* ================================================== */

const $ = (id) => document.getElementById(id);
const state = { name: '', emp: '', phone: '', token: '', questions: [], answers: [], hintOpen: [], idx: 0, busy: false, duplicate: null, dupShown: false, save: 'none' };

document.title = EVENT_TITLE;
$('title').textContent = EVENT_TITLE;
$('intro-note').textContent = `${QUESTIONS_PER_QUIZ}문제가 무작위로 출제됩니다. 휴대전화번호당 한 번만 참여할 수 있습니다.`;

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  window.scrollTo(0, 0);
}
function setBusy(btn, busy, label) { btn.disabled = busy; btn.textContent = label; }
function digits(v) { return String(v || '').replace(/\D/g, ''); }
function isValidPhone(d) { return /^01[016789]\d{7,8}$/.test(d); }
function isValidEmp(s) { return /^[0-9A-Za-z-]{1,20}$/.test(s); }
function maskPhone(d) { return d.length >= 8 ? `${d.slice(0, 3)}-****-${d.slice(-4)}` : d; }
function fmtTime(iso) {
  const d = iso ? new Date(iso) : new Date();
  return isNaN(d) ? String(iso) : d.toLocaleString('ko-KR', { hour12: false });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function newToken() {
  try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* 구형 브라우저 */ }
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
}

/* 서버가 'busy'를 주거나(잠금 대기 초과), 응답이 JSON이 아니거나(할당량 초과 시 HTML 페이지),
   네트워크 오류가 나면 지수 백오프 + 지터로 재시도. 그 외 ok:false는 그대로 반환 */
async function requestJson(url, options, onRetry, attempts) {
  const max = attempts == null ? RETRY.attempts : attempts;
  let lastErr;
  for (let i = 0; i <= max; i++) {
    try {
      const res = await fetch(url, options);
      const data = await res.json();
      if (data && data.error === 'busy') throw new Error('busy');
      return data;
    } catch (e) {
      lastErr = e;
      if (i === max) break;
      const wait = RETRY.baseMs * Math.pow(2, i) * (0.5 + Math.random());
      if (onRetry) onRetry(i + 1, Math.max(1, Math.round(wait / 1000)));
      await sleep(wait);
    }
  }
  throw lastErr;
}
// POST: Content-Type을 지정하지 않으면 text/plain으로 전송되어 CORS preflight가 발생하지 않음 (Apps Script는 OPTIONS 미지원)
const postJson = (payload, onRetry) => requestJson(API_URL, { method: 'POST', body: JSON.stringify(payload) }, onRetry);

/* 미리 불러오기: 페이지가 열리면 문제를, 전화번호가 다 입력되면 중복 여부를 백그라운드에서 받아 둠.
   "퀴즈 시작"을 누를 때는 대부분 이미 도착해 있어 기다림이 거의 없음 */
const prefetch = { questions: null, check: {} };
const questionsUrl = (phone) => `${API_URL}?action=questions${phone ? '&phone=' + encodeURIComponent(phone) : ''}&t=${Date.now()}`;
const checkUrl = (phone) => `${API_URL}?action=check&phone=${encodeURIComponent(phone)}&t=${Date.now()}`;
// 소요 시간을 콘솔에 남김 (PC 브라우저 F12 > Console 에서 [timing] 으로 확인)
function timed(label, p) {
  const t = performance.now();
  return p.finally(() => console.log(`[timing] ${label}: ${Math.round(performance.now() - t)} ms`));
}
function prefetchQuestions() {
  prefetch.questions = timed('문제 미리 받기', requestJson(questionsUrl(''), undefined, null, 1)).catch(() => null);
}
// 퀴즈 시작 직후 백그라운드로 중복 확인. 결과는 state.duplicate에 보관(true/false, 실패·미도착이면 null)
function startCheck(phone) {
  state.duplicate = null;
  state.dupShown = false;
  timed('중복 확인', requestJson(checkUrl(phone), undefined, null, 1))
    .then(res => { if (res && res.ok && digits($('phone').value) === phone) state.duplicate = !!res.duplicate; })
    .catch(() => {});
}
prefetchQuestions();

/* 전화번호 입력 시 하이픈 자동 삽입 + 번호가 완성되면 중복 여부 미리 확인 */
$('phone').addEventListener('input', (e) => {
  const d = digits(e.target.value).slice(0, 11);
  e.target.value = d.length > 7 ? `${d.slice(0, 3)}-${d.slice(3, 7)}-${d.slice(7)}`
                 : d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}`
                 : d;
  $('intro-error').textContent = '';
  $('btn-status').hidden = true;
});

/* 입력값 검증 (시작·결과 조회 공통) */
function readIntro(needConsent) {
  const err = $('intro-error');
  err.textContent = '';
  $('btn-status').hidden = true;
  const name = $('name').value.trim();
  const emp = $('emp').value.trim();
  const phone = digits($('phone').value);
  if (!name) { err.textContent = '이름을 입력해 주세요.'; return null; }
  if (!isValidEmp(emp)) { err.textContent = '개인번호를 입력해 주세요. 직원이 아닌 경우 0000입니다.'; return null; }
  if (!isValidPhone(phone)) { err.textContent = '휴대전화번호 형식이 올바르지 않습니다.'; return null; }
  if (needConsent && !$('agree').checked) { err.textContent = '개인정보 수집·이용에 동의해야 참여할 수 있습니다.'; return null; }
  state.name = name; state.emp = emp; state.phone = phone;
  return { name, emp, phone };
}

/* 1) 참가 정보 확인 → 문제 받기 */
$('btn-start').addEventListener('click', async () => {
  if (state.busy) return;
  const info = readIntro(true);
  if (!info) return;
  const err = $('intro-error');
  state.token = newToken(); // 이번 참여 시도의 식별자 (제출 재시도 시 중복 저장 방지)
  state.busy = true;
  const btn = $('btn-start');
  setBusy(btn, true, '문제를 불러오는 중…');
  const tStart = performance.now();
  try {
    const onRetry = (n, s) => setBusy(btn, true, `접속이 많아 ${s}초 후 다시 시도합니다 (${n}/${RETRY.attempts})`);
    // 문제: 미리 받아 둔 것이 있으면 바로 사용, 없거나 실패했으면 지금 요청. 중복 확인은 기다리지 않음
    let data = prefetch.questions ? await prefetch.questions : null;
    prefetch.questions = null;
    if (!data || !data.ok || !Array.isArray(data.questions) || data.questions.length === 0) {
      data = await timed('문제 요청(즉시)', requestJson(questionsUrl(''), undefined, onRetry));
      if (!data.ok || !Array.isArray(data.questions) || data.questions.length === 0) {
        throw new Error(data.error || 'no questions');
      }
    }
    console.log(`[timing] 시작 버튼 → 문제 표시: ${Math.round(performance.now() - tStart)} ms`);
    state.questions = data.questions;
    state.answers = new Array(data.questions.length).fill(null);
    state.hintOpen = new Array(data.questions.length).fill(false);
    state.idx = 0;
    $('qtotal').textContent = data.questions.length;
    $('rail').innerHTML = data.questions.map(() => '<i></i>').join('');
    $('btn-quiz-status').hidden = true;
    render();
    show('s-quiz');
    startCheck(info.phone); // 퀴즈를 보여준 뒤 백그라운드로 중복 확인 → 제출 시 반영
  } catch (e) {
    console.error(e);
    err.textContent = '시작하지 못했습니다. 잠시 후 다시 눌러 주세요. (' + ((e && e.message) || '알 수 없는 오류') + ')';
  } finally {
    state.busy = false;
    setBusy(btn, false, '퀴즈 시작');
  }
});

// 제출 시점에 중복으로 판명: 퀴즈 화면에 안내하고 "내 결과 보기"로 연결
function showDuplicateOnQuiz() {
  state.duplicate = true;
  state.dupShown = true;
  $('quiz-error').textContent = '이미 참여한 휴대전화번호입니다. 결과와 상품 지급 여부는 아래 버튼으로 확인할 수 있습니다.';
  $('btn-quiz-status').hidden = false;
  $('btn-next').disabled = true;
}

/* 저장된 결과 조회 (이름·번호가 저장값과 일치해야 함). 첫 화면과 퀴즈 화면 양쪽에서 사용 */
async function loadStatus(btn, errEl) {
  if (state.busy) return;
  state.busy = true;
  setBusy(btn, true, '결과를 불러오는 중…');
  try {
    const url = `${API_URL}?action=status&phone=${encodeURIComponent(state.phone)}&name=${encodeURIComponent(state.name)}&t=${Date.now()}`;
    const data = await requestJson(url, undefined,
      (n, s) => setBusy(btn, true, `접속이 많아 ${s}초 후 다시 시도합니다 (${n}/${RETRY.attempts})`));
    if (!data.ok) {
      errEl.textContent = data.error === 'name_mismatch' ? '저장된 이름과 다릅니다. 참여할 때 입력한 이름을 정확히 입력해 주세요.'
                        : data.error === 'not_found' ? '이 번호로 저장된 결과가 없습니다.'
                        : '결과를 불러오지 못했습니다. (' + (data.error || '알 수 없는 오류') + ')';
      return;
    }
    showResult(data);
  } catch (e) {
    console.error(e);
    errEl.textContent = '결과를 불러오지 못했습니다. (' + ((e && e.message) || '알 수 없는 오류') + ')';
  } finally {
    state.busy = false;
    setBusy(btn, false, '내 결과 보기');
  }
}
$('btn-status').addEventListener('click', () => { if (readIntro(false)) { $('btn-status').hidden = false; loadStatus($('btn-status'), $('intro-error')); } });
$('btn-quiz-status').addEventListener('click', () => loadStatus($('btn-quiz-status'), $('quiz-error')));

/* 2) 문제 화면 */
function render() {
  const q = state.questions[state.idx];
  const chosen = state.answers[state.idx];
  $('qnum').textContent = state.idx + 1;
  $('qtext').textContent = q.question;

  const opts = $('opts');
  opts.innerHTML = '';
  opts.classList.toggle('two', q.options.length === 2); // O/X처럼 보기 2개면 좌우 배치
  q.options.forEach((text) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', chosen === text ? 'true' : 'false');
    b.textContent = text;
    b.addEventListener('click', () => { state.answers[state.idx] = text; render(); });
    opts.appendChild(b);
  });

  const hint = String(q.hint || '').trim();
  const open = hint !== '' && !!state.hintOpen[state.idx];
  $('btn-hint').hidden = hint === '';
  $('btn-hint').textContent = open ? '힌트 닫기' : '힌트 보기';
  $('btn-hint').setAttribute('aria-expanded', open ? 'true' : 'false');
  $('hint').hidden = !open;
  $('hint').textContent = hint;

  Array.from($('rail').children).forEach((el, i) => {
    el.className = state.answers[i] !== null ? 'done' : (i === state.idx ? 'cur' : '');
  });

  const last = state.idx === state.questions.length - 1;
  $('btn-prev').style.visibility = state.idx === 0 ? 'hidden' : 'visible';
  $('btn-next').textContent = last ? '제출하기' : '다음';
  // 중복은 '제출하기'를 눌렀을 때 안내하므로, 안내 전에는 버튼을 막지 않음
  $('btn-next').disabled = chosen === null || state.dupShown;
  if (!state.dupShown) { $('quiz-error').textContent = ''; $('btn-quiz-status').hidden = true; }
}

$('btn-hint').addEventListener('click', () => { state.hintOpen[state.idx] = !state.hintOpen[state.idx]; render(); });
$('btn-prev').addEventListener('click', () => { if (state.busy) return; if (state.idx > 0) { state.idx--; render(); } });
$('btn-next').addEventListener('click', () => {
  if (state.busy) return;
  if (state.answers[state.idx] === null) return;
  if (state.idx < state.questions.length - 1) { state.idx++; render(); return; }
  submit();
});

/* 3) 제출: 브라우저에서 채점.
   - 전부 정답(상품 대상): 결과를 먼저 보여주고 저장은 뒤에서. 저장이 끝나면 "운영자 확인" 버튼이 나타남
   - 그 외: 저장이 끝난 뒤 결과 화면으로 이동 (결과만 보고 바로 닫아도 통계에서 빠지지 않도록) */
function submit() {
  if (state.busy || !state.questions.length) return;
  const missing = state.answers.findIndex(a => a === null);
  if (missing !== -1) {
    state.idx = missing; render();
    $('quiz-error').textContent = '아직 답하지 않은 문제가 있습니다.';
    return;
  }
  if (state.duplicate === true) { showDuplicateOnQuiz(); return; } // 시작 직후 보낸 확인 결과가 이미 '중복'

  const results = state.questions.map((q, i) => ({
    id: q.id, question: q.question, choice: state.answers[i],
    correct: state.answers[i] === q.answer, answer: q.answer,
  }));
  const score = results.filter(r => r.correct).length;
  const local = {
    ok: true, name: state.name, emp_id: state.emp, score, total: results.length,
    eligible: score >= PRIZE_MIN_SCORE, claimed: false, claimed_at: '', results,
  };
  if (local.eligible) {
    showResult(local);
    saveInBackground();
  } else {
    saveThenShow(local);
  }
}

function buildPayload() {
  return {
    name: state.name, emp_id: state.emp, phone: state.phone, token: state.token, // 같은 token이면 재시도해도 한 번만 저장됨
    answers: state.questions.map((q, i) => ({ id: q.id, choice: state.answers[i] })),
    ua: navigator.userAgent,
  };
}

/* 상품 대상자: 결과 화면 뒤에서 저장. 화면에는 저장 중 표시를 하지 않고, 끝나면 운영자 확인 버튼만 나타남 */
async function saveInBackground() {
  if (state.save === 'saving') return;
  setSaveState('saving');
  try {
    const data = await timed('답안 저장', postJson(buildPayload(), null));
    if (data.ok) { setSaveState('saved', '', data); return; }
    if (data.error === 'duplicate') { setSaveState('duplicate'); return; }
    setSaveState('failed', data.error || '알 수 없는 오류');
  } catch (e) {
    console.error(e);
    setSaveState('failed', (e && e.message) || '알 수 없는 오류');
  }
}

/* 상품 대상이 아닌 참가자: 저장이 끝난 뒤에 결과 화면으로 */
async function saveThenShow(local) {
  state.busy = true;
  const btn = $('btn-next');
  setBusy(btn, true, '제출 중…');
  $('btn-prev').disabled = true;
  try {
    const data = await timed('답안 저장', postJson(buildPayload(),
      (n, s) => setBusy(btn, true, `접속이 많아 ${s}초 후 다시 제출합니다 (${n}/${RETRY.attempts})`)));
    if (!data.ok) {
      if (data.error === 'duplicate') { showDuplicateOnQuiz(); return; } // 서버 최종 검사 결과
      $('quiz-error').textContent = '제출에 실패했습니다. (' + (data.error || '알 수 없는 오류') + ')';
      return;
    }
    showResult(local);
  } catch (e) {
    console.error(e);
    $('quiz-error').textContent = '제출에 실패했습니다. 잠시 후 "제출하기"를 다시 눌러 주세요. (' + ((e && e.message) || '알 수 없는 오류') + ')';
  } finally {
    state.busy = false;
    $('btn-prev').disabled = false;
    setBusy(btn, false, '제출하기');
    if (state.dupShown) $('btn-next').disabled = true;
  }
}

/* 저장 상태를 결과 화면에 반영. 저장 중에는 아무 표시 없이 운영자 확인 버튼만 숨김 */
function setSaveState(kind, msg, data) {
  state.save = kind;
  const bar = $('save-bar'), text = $('save-text');
  bar.hidden = true; bar.classList.toggle('warn', kind === 'failed' || kind === 'duplicate');
  $('btn-resave').hidden = kind !== 'failed';
  $('btn-result-status').hidden = kind !== 'duplicate';
  if (kind === 'saving') {
    $('btn-claim').hidden = false;   // 버튼은 보이되 저장이 끝날 때까지 비활성
    $('btn-claim').disabled = true;
    $('claimed-box').hidden = true;
  } else if (kind === 'saved') {
    renderClaim(!!(data && data.claimed), data ? data.claimed_at : ''); // 저장 완료 → 버튼 활성 (이미 지급된 건이면 지급 완료 표시)
  } else if (kind === 'duplicate') {
    bar.hidden = false;
    text.textContent = '이미 참여한 휴대전화번호입니다. 이번 답안은 저장되지 않았습니다. 이전 결과와 지급 여부는 아래 버튼으로 확인할 수 있습니다.';
    $('prize').hidden = true;
    $('result-title').textContent = '이미 참여한 번호입니다';
  } else if (kind === 'failed') {
    bar.hidden = false;
    text.textContent = '결과를 저장하지 못했습니다. 아래 버튼을 눌러 다시 저장해 주세요. (' + msg + ')';
    $('btn-claim').hidden = false;
    $('btn-claim').disabled = true;
  }
}
$('btn-resave').addEventListener('click', () => saveInBackground());
$('btn-result-status').addEventListener('click', () => loadStatus($('btn-result-status'), $('save-text')));

/* 4) 결과 화면 (제출 직후·결과 조회 공통) */
function showResult(data) {
  setSaveState('none'); // 조회로 연 결과는 이미 저장된 것. 제출 직후에는 이어서 'saving'으로 바뀜
  const won = !!data.eligible || Number(data.score) >= PRIZE_MIN_SCORE;
  $('score').textContent = data.score;
  $('total').textContent = data.total;
  $('result-title').textContent = won ? '축하합니다!' : '참여 완료';
  $('who').textContent = `${data.name || state.name} · 개인번호 ${data.emp_id || state.emp} · ${maskPhone(state.phone)}`;
  $('prize').hidden = !won;
  $('claim-error').textContent = '';
  if (won) {
    $('prize-text').textContent = PRIZE_TEXT;
    renderClaim(!!data.claimed, data.claimed_at);
  }
  $('result-note').textContent = won ? '' : NO_PRIZE_TEXT;
  $('review').innerHTML = (data.results || []).map(r => {
    const ok = !!r.correct;
    const detail = ok
      ? `<div class="ans">정답: ${esc(r.answer || '')}</div>`
      : `<div class="ans">선택한 답: ${esc(r.choice || '')}<br>정답: ${esc(r.answer || '')}</div>`;
    return `<li class="${ok ? 'ok' : 'no'}"><span class="mark">${ok ? '○' : '?'}</span>${esc(r.question || r.id)}${detail}</li>`;
  }).join('');
  show('s-result');
}

function renderClaim(claimed, claimedAt) {
  $('btn-claim').hidden = claimed;
  $('btn-claim').disabled = false;
  const box = $('claimed-box');
  box.hidden = !claimed;
  if (claimed) box.innerHTML = `지급 완료<small>${esc(fmtTime(claimedAt))}</small>`;
}

/* 5) 운영자 확인: 서버에 지급 기록. 한 번 기록되면 다시 지급되지 않음 */
$('btn-claim').addEventListener('click', async () => {
  if (state.busy || $('prize').hidden || $('btn-claim').hidden || state.save === 'saving' || state.save === 'failed' || state.save === 'duplicate') return;
  const err = $('claim-error');
  err.textContent = '';
  if (!window.confirm('운영자 확인입니다. 상품을 지급하셨습니까?')) return;
  state.busy = true;
  const btn = $('btn-claim');
  setBusy(btn, true, '확인 중…');
  try {
    let pin = '';
    for (let attempt = 0; attempt < 3; attempt++) {
      const data = await postJson({ action: 'claim', phone: state.phone, name: state.name, pin },
        (n, s) => setBusy(btn, true, `접속이 많아 ${s}초 후 다시 시도합니다 (${n}/${RETRY.attempts})`));
      if (data.ok) { renderClaim(true, data.claimed_at); return; }
      if (data.error === 'already_claimed') {
        renderClaim(true, data.claimed_at);
        err.textContent = '이미 지급된 건입니다.';
        return;
      }
      if (data.error === 'pin_required' || data.error === 'bad_pin') {
        const input = window.prompt(data.error === 'bad_pin' ? 'PIN이 틀렸습니다. 운영자 PIN을 입력하세요.' : '운영자 PIN을 입력하세요.');
        if (input === null) return; // 취소
        pin = input.trim();
        continue;
      }
      err.textContent = data.error === 'not_eligible' ? '상품 대상이 아닙니다.'
                      : data.error === 'name_mismatch' ? '저장된 이름과 다릅니다.'
                      : '확인에 실패했습니다. (' + (data.error || '알 수 없는 오류') + ')';
      return;
    }
    err.textContent = 'PIN 입력 횟수를 초과했습니다.';
  } catch (e) {
    console.error(e);
    err.textContent = '확인에 실패했습니다. (' + ((e && e.message) || '알 수 없는 오류') + ')';
  } finally {
    state.busy = false;
    setBusy(btn, false, '운영자 확인');
  }
});
</script>
</body>
</html>
